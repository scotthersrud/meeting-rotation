<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Management Standup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Optimizely brand fonts (served from optimizely.com) */
  @font-face { font-family: "VC Nudge"; src: url(https://www.optimizely.com/fonts/vc-nudge/NudgeSemiNormal-SemiNormalSemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "VC Nudge"; src: url(https://www.optimizely.com/fonts/vc-nudge/NudgeSemiNormal-SemiNormalExtraBold.woff2) format("woff2"); font-weight: 800; font-display: swap; }
  @font-face { font-family: "Die Grotesk B"; src: url(https://www.optimizely.com/fonts/die-grotesk/die-grotesk-b-regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Die Grotesk B"; src: url(https://www.optimizely.com/fonts/die-grotesk/die-grotesk-b-medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Die Grotesk B"; src: url(https://www.optimizely.com/fonts/die-grotesk/die-grotesk-b-bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }

  :root {
    /* Optimizely palette (from optimizely.com CSS variables) */
    --bg: #08251a;      /* fir-darkfir */
    --card: #0d3a29;    /* fir-midfir */
    --line: #114b36;    /* fir-600 */
    --lime: #abff44;    /* extrusion-1 */
    --text: #eff6e9;    /* neutral-2 */
    --muted: #a3bfae;
    --headline: "VC Nudge", -apple-system, sans-serif;
    --overline: "Roboto Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Die Grotesk B", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 20% 0%, #156045 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 760px; }

  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
  .eyebrow { font-family: var(--overline); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--lime); font-weight: 700; }
  .week { color: var(--muted); font-size: 14px; }

  .hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px;
    display: flex;
    align-items: center;
    gap: 28px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -80px; top: -80px;
    width: 240px; height: 240px; border-radius: 50%;
    background: var(--lime); opacity: .07;
  }
  .avatar {
    flex: 0 0 auto;
    width: 112px; height: 112px; border-radius: 50%;
    background: var(--lime); color: var(--bg);
    display: grid; place-items: center;
    font-family: var(--headline); font-size: 44px; font-weight: 800;
    box-shadow: 0 0 0 6px rgba(171,255,68,.15), 0 0 40px rgba(171,255,68,.35);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 0 10px rgba(171,255,68,.08), 0 0 60px rgba(171,255,68,.45); }
  }
  .label { font-family: var(--overline); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
  .name { font-family: var(--headline); font-size: 56px; font-weight: 800; line-height: 1.05; margin: 4px 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.backup { border-color: rgba(171,255,68,.5); }
  .chip.backup b { color: var(--lime); }

  h2 { font-family: var(--overline); font-weight: 500; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 36px 0 14px; }

  .ring { display: flex; justify-content: space-between; gap: 6px; }
  .dot { text-align: center; flex: 1; min-width: 0; }
  .dot .circle {
    width: 48px; height: 48px; margin: 0 auto 8px; border-radius: 50%;
    display: grid; place-items: center; font-family: var(--headline); font-weight: 600; font-size: 16px;
    background: var(--card); border: 2px solid var(--line); color: var(--muted);
    transition: transform .2s;
  }
  .dot.now .circle { background: var(--lime); border-color: var(--lime); color: var(--bg); transform: scale(1.15); }
  .dot.next .circle { border-color: var(--lime); color: var(--lime); }
  .dot span { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; }
  .dot.now span { color: var(--text); font-weight: 600; }

  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 140px 1fr 1fr; padding: 12px 20px; font-size: 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.head { font-family: var(--overline); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  .row .d { color: var(--muted); }
  .row .b { color: var(--muted); }

  footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; opacity: .7; }

  @media (max-width: 560px) {
    .hero { flex-direction: column; text-align: center; padding: 28px 20px; }
    .chips { justify-content: center; }
    .name { font-size: 40px; }
    .dot .circle { width: 34px; height: 34px; font-size: 13px; }
    .dot span { display: none; }
    .row { grid-template-columns: 100px 1fr 1fr; padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Feature Management Standup</div>
    <div class="week" id="week"></div>
  </header>

  <section class="hero">
    <div class="avatar" id="avatar"></div>
    <div>
      <div class="label" id="heroLabel">Running standup this week</div>
      <div class="name" id="primary"></div>
      <div class="chips">
        <div class="chip backup">Backup · <b id="backup"></b></div>
        <div class="chip" id="countdown"></div>
      </div>
    </div>
  </section>

  <h2>The Rotation</h2>
  <div class="ring" id="ring"></div>

  <h2>Coming Up</h2>
  <div class="list" id="list"></div>

  <footer>Rotates every Monday (Central Time) · Same order, forever</footer>
</div>

<script>
  // ===== Edit these =====
  const TEAM  = ["Juan", "Tameem", "Matjaz", "Zahid", "Saqib", "Farhan", "Junaed", "Imran", "Sandhya"];
  const START = Date.UTC(2026, 10, 16); // Mon Nov 16, 2026 (month is 0-based)
  const TZ    = "America/Chicago";
  // ======================

  const DAY = 864e5, WEEK = 7 * DAY;
  const fmt = (ms, opts) => new Date(ms).toLocaleDateString("en-US", { timeZone: "UTC", ...opts });
  const initials = n => n.slice(0, 2).toUpperCase();

  // Current date/time in Central Time (or ?date=YYYY-MM-DD to preview)
  function nowCentral() {
    const preview = new URLSearchParams(location.search).get("date");
    if (preview) {
      const [y, m, d] = preview.split("-").map(Number);
      return { day: Date.UTC(y, m - 1, d), mins: 0 };
    }
    const p = Object.fromEntries(
      new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, year: "numeric", month: "numeric", day: "numeric",
        hour: "numeric", minute: "numeric", hourCycle: "h23"
      }).formatToParts(new Date()).map(x => [x.type, +x.value])
    );
    return { day: Date.UTC(p.year, p.month - 1, p.day), mins: p.hour * 60 + p.minute };
  }

  function render() {
    const { day, mins } = nowCentral();
    const weeks = Math.floor((day - START) / WEEK);
    const before = weeks < 0;
    const i = before ? 0 : weeks % TEAM.length;
    const weekStart = before ? START : START + weeks * WEEK;
    const primary = TEAM[i], backup = TEAM[(i + 1) % TEAM.length];

    document.getElementById("week").textContent =
      `Week of ${fmt(weekStart, { month: "short", day: "numeric" })} – ${fmt(weekStart + 4 * DAY, { month: "short", day: "numeric", year: "numeric" })}`;
    document.getElementById("avatar").textContent = initials(primary);
    document.getElementById("primary").textContent = primary;
    document.getElementById("backup").textContent = backup;

    // Countdown to next handoff (Monday 00:00 CT)
    const minsLeft = before
      ? Math.round((START - day) / 6e4) - mins
      : Math.round((weekStart + WEEK - day) / 6e4) - mins;
    const d = Math.floor(minsLeft / 1440), h = Math.floor((minsLeft % 1440) / 60);
    document.getElementById("heroLabel").textContent = before ? "First up · rotation starts soon" : "Running standup this week";
    document.getElementById("countdown").innerHTML = before
      ? `Starts in <b>${d}d ${h}h</b>`
      : `Hands off to <b>${backup}</b> in <b>${d}d ${h}h</b>`;

    // Ring of everyone
    document.getElementById("ring").innerHTML = TEAM.map((n, k) => {
      const cls = k === i ? "now" : k === (i + 1) % TEAM.length ? "next" : "";
      return `<div class="dot ${cls}"><div class="circle">${initials(n)}</div><span>${n}</span></div>`;
    }).join("");

    // Upcoming weeks
    let rows = `<div class="row head"><div>Week of</div><div>Lead</div><div>Backup</div></div>`;
    for (let k = 1; k <= TEAM.length; k++) {
      const ws = weekStart + k * WEEK;
      rows += `<div class="row"><div class="d">${fmt(ws, { month: "short", day: "numeric", year: "numeric" })}</div>
               <div>${TEAM[(i + k) % TEAM.length]}</div><div class="b">${TEAM[(i + k + 1) % TEAM.length]}</div></div>`;
    }
    document.getElementById("list").innerHTML = rows;
  }

  render();
  setInterval(render, 60 * 1000);
</script>
</body>
</html>
